<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Coin Dozer</title>
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <canvas id="stage" touch-action="none"></canvas>

    <div id="loader">
      <div class="ring"></div>
      <p>물리 엔진을 준비하는 중…</p>
    </div>

    <div id="dim"></div>

    <div id="hud" hidden>
      <section id="clock">
        <time id="clock-time">--:--</time>
        <span id="clock-date"></span>
      </section>

      <header class="bar">
        <div class="ledger">
          <span class="item"><b>보유</b><i id="stat-wallet">0</i></span>
          <span class="item"><b>투입</b><i id="stat-in">0</i></span>
          <span class="item"><b>획득</b><i id="stat-won">0</i></span>
          <span class="item rate"><b>수익률</b><i id="stat-rate">—</i></span>
        </div>
        <button id="btn-settings" class="icon" aria-label="설정" aria-expanded="false">⚙</button>
      </header>

      <div id="toast"></div>

      <p id="hint">화면을 탭하면 깨어납니다 · 깨어 있을 때 탭하면 그 자리로 동전이 들어갑니다</p>

      <aside id="settings" aria-hidden="true">
        <div class="sheet-head">
          <h2>설정</h2>
          <button id="btn-close" class="icon" aria-label="닫기">✕</button>
        </div>

        <div class="row">
          <span>동전</span>
          <button id="btn-refill" class="pill gold">＋ 50개 추가</button>
        </div>
        <div class="row">
          <span>자동 투입</span>
          <button id="btn-auto" class="pill" aria-pressed="false">꺼짐</button>
        </div>
        <div class="row">
          <span>소리</span>
          <button id="btn-sound" class="pill" aria-pressed="true">켜짐</button>
        </div>
        <div class="row">
          <span>현재 상태</span>
          <button id="btn-share" class="pill">🔗 링크 복사</button>
        </div>

        <hr />

        <div class="row">
          <span>세팅 모드<em>영업 전 진열</em></span>
          <button id="btn-setup" class="pill" aria-pressed="false">꺼짐</button>
        </div>
        <div id="setup-body">
          <p class="sub">푸셔가 멈추고 배출 집계가 꺼집니다. 필드를 <b>탭</b>하면 그 자리에 동전을 놓고, 같은 자리를 반복하면 쌓입니다.</p>
          <div id="presets">
            <button data-preset="standard">기본</button>
            <button data-preset="loaded">가득</button>
            <button data-preset="brink">배출 직전</button>
            <button data-preset="edge">가장자리</button>
            <button data-preset="towers">탑 쌓기</button>
            <button data-preset="empty" class="danger">비우기</button>
          </div>
        </div>

        <p class="keys"><kbd>Space</kbd> 투입 · <kbd>←</kbd><kbd>→</kbd> 투입구 이동 · <kbd>E</kbd> 세팅 모드</p>
      </aside>

      <div id="fps"></div>
    </div>

    <script type="module" src="./src/main.js"></script>
  </body>
</html>
